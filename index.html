<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Websim Supporters (Tips)</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "marked": "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js",
        "dompurify": "https://cdn.jsdelivr.net/npm/dompurify/dist/purify.es.min.js"
      }
    }
  </script>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1>Supporters</h1>
      <p class="sub">Enter a Websim project URL or ID to list tip supporters.</p>
      <form id="project-form" class="input-row">
        <input id="project-input" type="text" placeholder="e.g. https://websim.ai/c/alex/my-project or project_123..." autocomplete="off" />
        <button id="load-btn" type="submit">Load</button>
      </form>
      <div id="meta" class="meta">
        <span id="project-title"></span>
        <span id="project-id"></span>
        <span id="total-credits"></span>
      </div>
    </header>

    <section id="controls" class="controls" hidden>
      <button id="prev-btn" disabled>Previous</button>
      <button id="next-btn" disabled>Next</button>
      <label class="sort">
        <input type="checkbox" id="best-toggle" /> Sort by best
      </label>
      <span id="page-indicator" class="page-indicator"></span>
    </section>

    <section id="results" class="results">
      <ul id="supporters" class="list"></ul>
      <div id="empty" class="empty" hidden>No tips yet.</div>
    </section>
  </main>

  <template id="supporter-item">
    <li class="item">
      <img class="avatar" alt="" />
      <div class="content">
        <div class="row">
          <div class="who">
            <span class="name"></span>
            <span class="username"></span>
          </div>
          <div class="amount">
            <span class="credits"></span>
          </div>
        </div>
        <div class="row meta2">
          <time class="time"></time>
        </div>
        <div class="comment"></div>
      </div>
    </li>
  </template>

  <script type="module" src="./script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
